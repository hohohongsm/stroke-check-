    B_top: "\uC8FC\uBCC0 \uC0AC\uB78C\uB4E4\uC5D0\uAC8C \uBE44\uD310\uC774\uB098 \uC9C0\uC801\uCC98\uB7FC \uC0C1\uB300\uAC00 \uBD88\uD3B8\uD560 \uC218 \uC788\uB294 \uD45C\uD604\uC744 \uD558\uB294 \uACBD\uC6B0(B)\uAC00 \uAC00\uC7A5 \uB192\uAC8C \uB098\uD0C0\uB0A9\uB2C8\uB2E4. \uD544\uC694\uD560 \uB54C \uD560 \uB9D0\uC744 \uD558\uB294 \uAC83\uC740 \uAD00\uACC4\uC5D0 \uD544\uC694\uD558\uC9C0\uB9CC, \uADF8 \uBE44\uC911\uC774 \uD06C\uBA74 \uC0C1\uB300\uC5D0\uAC8C\uB294 \uB098\uC640\uC758 \uC2DC\uAC04\uC774 \uC9C0\uC801\uBC1B\uAC70\uB098 \uAE34\uC7A5\uB418\uB294 \uC21C\uAC04\uC73C\uB85C \uAE30\uC5B5\uB420 \uC218 \uC788\uC5B4\uC694. \uB2E4\uB9CC \uC9C0\uC801\uD558\uACE0 \uC2F6\uC740 \uB9C8\uC74C\uC5D0\uB294 \uB300\uAC1C \uC0C1\uB300\uAC00 \uB354 \uB098\uC544\uC9C0\uAE38 \uBC14\uB77C\uB294 \uC88B\uC740 \uC758\uB3C4\uAC00 \uB2F4\uACA8 \uC788\uC8E0. \uADF8 \uC758\uB3C4\uB97C '\uC65C \uC774\uAC83\uBC16\uC5D0 \uC548 \uB410\uC5B4\uC694'\uAC00 \uC544\uB2C8\uB77C '\uC774\uB807\uAC8C \uD558\uBA74 \uB354 \uC88B\uC544\uC9C8 \uAC83 \uAC19\uC544\uC694'\uCC98\uB7FC \uAE0D\uC815\uC801\uC778 \uBC29\uC2DD\uC73C\uB85C \uC804\uD574\uBCF4\uBA74, \uAC19\uC740 \uB9C8\uC74C\uB3C4 \uC0C1\uB300\uC5D0\uAC8C \uB2E4\uB974\uAC8C \uAC00\uB2FF\uC2B5\uB2C8\uB2E4. \uC778\uC815\uC774\uB098 \uAC10\uC0AC\uB97C \uD568\uAED8 \uAC74\uB124\uBA74 \uAF2D \uD544\uC694\uD55C \uC9C0\uC801\uB3C4 \uB354 \uC798 \uBC1B\uC544\uB4E4\uC5EC\uC838\uC694.",

    pos_verify: "\uC8FC\uBCC0\uACFC \uAE0D\uC815\uC801\uC778 \uC790\uADF9\uACFC \uBC18\uC751(A\xB7C)\uC744 \uD65C\uBC1C\uD788 \uC8FC\uACE0\uBC1B\uACE0 \uC788\uB294 \uAC83\uC73C\uB85C \uBCF4\uC785\uB2C8\uB2E4. \uAD00\uACC4\uC5D0 \uC2E0\uB8B0\uAC00 \uC313\uC774\uB294 \uBC29\uD5A5\uC73C\uB85C \uC9C0\uB0B4\uACE0 \uC788\uC5B4\uC694. \uB2E4\uB9CC \uD55C \uAC00\uC9C0 \uC0B4\uD3B4\uBCFC \uC810\uC774 \uC788\uC2B5\uB2C8\uB2E4. \uBD80\uB52A\uD798\uC774 \uAC70\uC758 \uC5C6\uB294 \uAC83\uC774 \uC11C\uB85C \uD3B8\uD574\uC11C\uC778\uC9C0, \uC544\uB2C8\uBA74 \uBD88\uD3B8\uD55C \uC774\uC57C\uAE30\uB97C \uAEBC\uB0B4\uC9C0 \uBABB\uD574\uC11C\uC778\uC9C0\uC608\uC694. \uC88B\uC740 \uAD00\uACC4\uB97C \uC9C0\uD0A4\uB824\uB2E4 \uD560 \uB9D0\uC744 \uCC38\uB294 \uACBD\uC6B0\uAC00 \uC788\uB294\uB370, \uC624\uD788\uB824 \uD544\uC694\uD55C \uC21C\uAC04\uC5D0 \uC194\uC9C1\uD558\uACE0 \uBD84\uBA85\uD558\uAC8C \uD45C\uD604\uD558\uB294 \uAC83\uC774 \uB098\uB97C \uC9C0\uD0A4\uB294 \uBC29\uBC95\uC774 \uB429\uB2C8\uB2E4. \uCD5C\uADFC\uC5D0 \uBD88\uD3B8\uD558\uC9C0\uB9CC \uD544\uC694\uD55C \uC774\uC57C\uAE30\uB97C \uAC74\uB128 \uC801\uC774 \uC788\uB294\uC9C0 \uB5A0\uC62C\uB824\uBCF4\uBA74 \uC88B\uACA0\uC2B5\uB2C8\uB2E4.",
    pos_firm: "\uC8FC\uBCC0\uACFC \uAE0D\uC815\uC801\uC778 \uC790\uADF9\uACFC \uBC18\uC751(A\xB7C)\uC744 \uD65C\uBC1C\uD788 \uC8FC\uACE0\uBC1B\uACE0 \uC788\uB294 \uAC83\uC73C\uB85C \uBCF4\uC785\uB2C8\uB2E4. \uB300\uCCB4\uB85C \uC778\uC815\uACFC \uAD00\uC2EC\uC744 \uAC74\uB124\uBA74\uC11C\uB3C4, \uD544\uC694\uD560 \uB54C\uB294 \uD560 \uB9D0\uC744 \uD558\uB294 \uD3B8\uC774\uC5D0\uC694(B). \uAE0D\uC815\uC801\uC778 \uAD50\uB958\uAC00 \uD6E8\uC52C \uB9CE\uC740 \uAC00\uC6B4\uB370 \uD544\uC694\uD560 \uB54C \uB2E8\uD638\uD568\uC744 \uBCF4\uC774\uB294 \uAC83\uC740, \uAD00\uACC4\uB97C \uC9C0\uD0A4\uB294 \uAC74\uAC15\uD55C \uBC29\uC2DD\uC77C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC9C0\uAE08\uC758 \uADE0\uD615 \u2014 \uD3C9\uC18C\uC5D0\uB294 \uB530\uB73B\uD558\uAC8C, \uD544\uC694\uD560 \uB54C\uB294 \uBD84\uBA85\uD558\uAC8C \u2014 \uC744 \uC720\uC9C0\uD558\uB418, \uC9C0\uC801\uC774\uB098 \uBD88\uD3B8\uD55C \uD45C\uD604\uC774 \uC9C0\uAE08\uBCF4\uB2E4 \uB354 \uB298\uC9C0 \uC54A\uB3C4\uB85D \uC0B4\uD3B4\uBCF4\uBA74 \uC88B\uACA0\uC5B4\uC694. \uBD80\uC815\uC801\uC778 \uD45C\uD604\uC774 \uB9CE\uC544\uC9C0\uBA74, \uC560\uC368 \uC313\uC544\uC628 \uAE0D\uC815\uC801\uC778 \uAD50\uB958\uC758 \uD6A8\uACFC\uB3C4 \uC904\uC5B4\uB4E4 \uC218 \uC788\uC73C\uB2C8\uAE4C\uC694.",
    pos_coexist: "\uC8FC\uBCC0\uACFC \uAE0D\uC815\uC801\uC778 \uC790\uADF9\uACFC \uBC18\uC751(A\xB7C)\uC744 \uD65C\uBC1C\uD788 \uC8FC\uACE0\uBC1B\uACE0 \uC788\uB294 \uAC83\uC73C\uB85C \uBCF4\uC785\uB2C8\uB2E4. \uB3D9\uC2DC\uC5D0, \uC9C0\uC801\uC774\uB098 \uBD88\uD3B8\uD568\uC744 \uD45C\uD604\uD558\uB294 \uACBD\uC6B0(B)\uB3C4 \uC801\uC9C0 \uC54A\uAC8C \uB098\uD0C0\uB098\uACE0 \uC788\uC5B4\uC694. \uAD00\uACC4\uC5D0 \uC5D0\uB108\uC9C0\uAC00 \uC788\uB2E4\uB294 \uC2E0\uD638\uC774\uC9C0\uB9CC, \uBD80\uC815\uC801\uC778 \uC790\uADF9\uC774 \uB298\uC5B4\uB098\uBA74 \uC560\uC368 \uC313\uC740 \uAE0D\uC815\uC801\uC778 \uAD50\uB958\uC5D0\uB3C4 \uC601\uD5A5\uC744 \uC904 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC0AC\uB78C\uC774\uB098 \uC0C1\uD669\uC5D0 \uB530\uB77C \uB300\uD558\uB294 \uBC29\uC2DD\uC774 \uD06C\uAC8C \uB2EC\uB77C\uC9C0\uACE0 \uC788\uC9C4 \uC54A\uC740\uC9C0, \uD2B9\uD788 \uBD88\uD3B8\uD568\uC744 \uC804\uD558\uB294 \uBC29\uC2DD\uC774 \uC0C1\uB300\uC5D0\uAC8C \uC5B4\uB5BB\uAC8C \uAC00\uB2FF\uB294\uC9C0 \uC0B4\uD3B4\uBCF4\uBA74 \uC88B\uACA0\uC2B5\uB2C8\uB2E4.",
    give_more: "\uC8FC\uBCC0\uC5D0 \uAE0D\uC815\uC801\uC778 \uC790\uADF9\uC744 \uAC74\uB124\uB294 \uAC83(A)\uC5D0 \uBE44\uD574, \uB3CC\uC544\uC624\uB294 \uAE0D\uC815\uC801\uC778 \uBC18\uC751(C)\uC740 \uADF8\uC5D0 \uBABB \uBBF8\uCE58\uB294 \uD3B8\uC774\uC5D0\uC694. \uC8FC\uAE30\uB9CC \uD558\uB294 \uC0C1\uD0DC\uAC00 \uAE38\uC5B4\uC9C0\uBA74 \uB9C8\uC74C\uC774 \uC9C0\uCE60 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBC1B\uC740 \uC778\uC815\uC744 \uBC00\uC5B4\uB0B4\uC9C0 \uC54A\uACE0 \uC628\uC804\uD788 \uBC1B\uC544\uB4E4\uC774\uB294 \uC5F0\uC2B5, \uADF8\uB9AC\uACE0 \uD544\uC694\uD560 \uB54C\uB294 \uB098\uB3C4 \uC778\uC815\uC744 \uCCAD\uD574\uBCF4\uB294 \uAC83\uC744 \uD568\uAED8 \uCC59\uACA8\uBCF4\uBA74 \uC88B\uACA0\uC5B4\uC694.",
    receive_more: "\uC8FC\uBCC0\uC5D0\uC11C \uBC1B\uB294 \uAE0D\uC815\uC801\uC778 \uBC18\uC751(C)\uC5D0 \uBE44\uD574, \uB0B4\uAC00 \uBA3C\uC800 \uAC74\uB124\uB294 \uAE0D\uC815\uC801\uC778 \uC790\uADF9(A)\uC740 \uC801\uC740 \uD3B8\uC774\uC5D0\uC694. \uC8FC\uACE0\uBC1B\uC74C\uC774 \uD55C\uCABD\uC73C\uB85C \uAE30\uC6B8\uBA74 \uADF8 \uD750\uB984\uC774 \uC810\uCC28 \uC904\uC5B4\uB4E4 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBC1B\uC740 \uB9CC\uD07C \uB098\uB3C4 \uD45C\uD604\uD574\uBCF4\uB294 \uAC83\uC744 \uC870\uAE08\uC529 \uC758\uC2DD\uD574\uBCF4\uBA74 \uC88B\uACA0\uC5B4\uC694.",

    all_low: "\uB2E4\uC12F \uC601\uC5ED\uC774 \uBAA8\uB450 \uB0AE\uAC8C \uB098\uD0C0\uB0A9\uB2C8\uB2E4. \uB450 \uAC00\uC9C0\uB85C \uBCFC \uC218 \uC788\uC5B4\uC694. \uC2E4\uC81C\uB85C \uC0AC\uB78C\uB4E4\uACFC \uC8FC\uACE0\uBC1B\uB294 \uAD50\uB958\uAC00 \uC804\uBC18\uC801\uC73C\uB85C \uC801\uC740 \uC0C1\uD0DC\uC774\uAC70\uB098, \uBB38\uD56D\uC5D0 '\uADF8\uB807\uB2E4'\uACE0 \uB2F5\uD558\uAE30\uB97C \uC2E0\uC911\uD558\uAC8C \uD558\uC168\uC744 \uC218\uB3C4 \uC788\uC2B5\uB2C8\uB2E4. \uB9CC\uC57D \uC804\uC790\uB77C\uBA74, \uAC08\uB4F1\uC774 \uC801\uC5B4 \uD3B8\uC548\uD55C \uB300\uC2E0 \uC778\uC815\uACFC \uC5F0\uACB0\uC758 \uAE30\uD68C\uB3C4 \uC801\uC744 \uC218 \uC788\uC5B4\uC694. \uC6B0\uB9AC\uB294 \uACB0\uAD6D \uB2E4\uB978 \uC0AC\uB78C\uACFC \uC5B4\uC6B8\uB9AC\uBA70 \uC0B4\uC544\uAC00\uACE0, \uC2E0\uB8B0\uB3C4 \uC8FC\uACE0\uBC1B\uB294 \uAD50\uB958\uAC00 \uC313\uC5EC\uC57C \uC0DD\uACA8\uB0A9\uB2C8\uB2E4. \uC9C0\uAE08\uC758 \uAC70\uB9AC\uAC10\uC774 \uC2A4\uC2A4\uB85C \uC120\uD0DD\uD55C \uD3B8\uC548\uD568\uC778\uC9C0, \uB354 \uB098\uB204\uACE0 \uC2F6\uC740 \uB9C8\uC74C\uC774 \uC788\uB294\uC9C0 \uB3CC\uC544\uBCF4\uBA74 \uC88B\uACA0\uC2B5\uB2C8\uB2E4. \uBD80\uB2F4\uB418\uC9C0 \uC54A\uB294 \uC120\uC5D0\uC11C \uD558\uB8E8 \uD55C \uBC88, \uC9E7\uC740 \uC778\uC0AC\uB098 \uC548\uBD80\uCC98\uB7FC \uC791\uC740 \uAD50\uB958\uB97C \uBA3C\uC800 \uAC74\uB124\uBCF4\uC138\uC694.",

      style: {
        ...font,
        flex: 2,
        padding: "15px",
        fontSize: 15,
        fontWeight: 700,
        color: "#fff",
        background: sectionComplete ? ACCENT : "#B9C4BF",
        border: "none",
        borderRadius: 12,
        cursor: sectionComplete ? "pointer" : "not-allowed",
        transition: "background 0.2s"
      }
    },
    sectionIdx < SECTIONS.length - 1 ? sectionComplete ? "\uB2E4\uC74C \uC601\uC5ED\uC73C\uB85C" : `${5 - answeredInSection}\uBB38\uD56D \uB0A8\uC74C` : sectionComplete ? "\uACB0\uACFC \uBCF4\uAE30" : `${5 - answeredInSection}\uBB38\uD56D \uB0A8\uC74C`
  ))));
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(StrokeDiagnosisApp));

</script>
